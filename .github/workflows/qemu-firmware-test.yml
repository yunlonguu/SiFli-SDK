name: QEMU Firmware Test

on:
  schedule:
    # 每天 UTC 00:00（北京 08:00）自动跑一次
    - cron: '0 0 * * *'
  push:
    branches: [main, ci/lvgl-test]
    paths:
      - '.github/workflows/qemu-firmware-test.yml'
      - 'example/**'
      - 'tools/qemu/**'
      - '.gitmodules'
  workflow_dispatch:

jobs:
  qemu-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ 例程 × 板子 组合 ============
          # project: scons 执行目录（--board 在这里跑）
          # ===========================================
          - name: hello_world
            project: example/get-started/hello_world/rtt/project
            board: sf32lb52-lcd_a128r16
            qemu_machine: sf32lb52x
            run_assert: |
              timeout 60 tools/qemu/qemu-system-arm -M "$QEMU_MACHINE" -nographic -kernel "$ELF" > qemu.log 2>&1 || true
              echo "===== QEMU output ====="
              cat qemu.log
              echo "===== assertions ====="
              grep -q "Hello world!" qemu.log || { echo "FAIL: missing 'Hello world!'"; exit 1; }
              grep -q "msh />"       qemu.log || { echo "FAIL: missing 'msh />'"; exit 1; }
              echo "PASS: hello_world booted to shell in QEMU"

          - name: hello_world
            project: example/get-started/hello_world/rtt/project
            board: sf32lb52-lchspi-ulp
            qemu_machine: "sf32lb52x,flash-base=0x12020000"
            run_assert: |
              timeout 60 tools/qemu/qemu-system-arm -M "$QEMU_MACHINE" -nographic -kernel "$ELF" > qemu.log 2>&1 || true
              echo "===== QEMU output ====="
              cat qemu.log
              echo "===== assertions ====="
              grep -q "Hello world!" qemu.log || { echo "FAIL: missing 'Hello world!'"; exit 1; }
              grep -q "msh />"       qemu.log || { echo "FAIL: missing 'msh />'"; exit 1; }
              echo "PASS: hello_world booted to shell in QEMU"

          - name: hello_world
            project: example/get-started/hello_world/rtt/project
            board: sf32lb52-lcd_n16r8
            qemu_machine: "sf32lb52x,flash-base=0x12020000"
            run_assert: |
              timeout 60 tools/qemu/qemu-system-arm -M "$QEMU_MACHINE" -nographic -kernel "$ELF" > qemu.log 2>&1 || true
              echo "===== QEMU output ====="
              cat qemu.log
              echo "===== assertions ====="
              grep -q "Hello world!" qemu.log || { echo "FAIL: missing 'Hello world!'"; exit 1; }
              grep -q "msh />"       qemu.log || { echo "FAIL: missing 'msh />'"; exit 1; }
              echo "PASS: hello_world booted to shell in QEMU"

          - name: lvgl_v8_demos
            project: example/multimedia/lvgl/lvgl_v8_demos/project
            board: sf32lb52-lcd_a128r16
            qemu_machine: sf32lb52x
            run_assert: |
              # push 跑截图冒烟；每日/手动运行等待完整 benchmark 报告。
              benchmark_args=()
              if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                benchmark_args=(--benchmark-source example/multimedia/lvgl/lvgl_v8_demos/src/lv_demos/benchmark/lv_demo_benchmark.c --timeout 240)
              fi
              python3 tools/qemu/headless_check.py \
                --qemu tools/qemu/qemu-system-arm \
                --machine "$QEMU_MACHINE" \
                --kernel "$ELF" \
                --expect-size 390x450 --expect-nonblack 0.5 --expect-colors 16 --min-diff-cells 8 \
                --shots 6 --shot-interval 1.5 --settle 14 \
                --serial-log qemu.log --ppm-dir shots "${benchmark_args[@]}"

          - name: lvgl_v8_examples
            project: example/multimedia/lvgl/lvgl_v8_examples/project
            board: sf32lb52-lcd_a128r16
            qemu_machine: sf32lb52x
            run_assert: |
              python3 tools/qemu/headless_check.py \
                --qemu tools/qemu/qemu-system-arm \
                --machine "$QEMU_MACHINE" \
                --kernel "$ELF" \
                --expect-size 390x450 --expect-nonblack 0.15 --expect-colors 12 \
                --shots 3 --shot-interval 1.0 --settle 14 --no-flow \
                --serial-log qemu.log --ppm-dir shots

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install SDK toolchain (arm-none-eabi-gcc, scons)
        run: ./install.sh --profile default

      - name: Build firmware
        run: |
          source ./export.sh
          which scons arm-none-eabi-gcc
          arm-none-eabi-gcc --version | head -1
          cd ${{ matrix.project }}
          scons --board=${{ matrix.board }} -j$(nproc)

      - name: Install QEMU runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsndio7.0 libpixman-1-0 libglib2.0-0 libnuma1
          echo "=== ldd missing check ==="
          ldd tools/qemu/qemu-system-arm | grep "not found" || echo "all shared libs resolved"

      - name: Run firmware in QEMU and assert
        timeout-minutes: 6
        run: |
          chmod +x tools/qemu/qemu-system-arm
          export ELF="${{ matrix.project }}/build_${{ matrix.board }}_hcpu/main.elf"
          export QEMU_MACHINE="${{ matrix.qemu_machine }}"
          ls -la "$ELF"
          ${{ matrix.run_assert }}

      - name: Upload QEMU log & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.board }}
          path: |
            qemu.log
            qemu.log.qemu.log
            shots/*.ppm
          if-no-files-found: ignore
