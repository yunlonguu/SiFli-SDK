name: QEMU Firmware Test

on:
  schedule:
    # 每天 UTC 00:00（北京 08:00）自动跑一次
    - cron: '0 0 * * *'
  push:
    branches: [main, ci/lvgl-test]
    paths:
      - '.github/workflows/qemu-firmware-test.yml'
      - 'example/**'
      - 'tools/qemu/**'
      - '.gitmodules'
  workflow_dispatch:

jobs:
  qemu-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============ 例程 × 板子 组合 ============
          # project: scons 执行目录（--board 在这里跑）
          # ===========================================
          - name: hello_world
            project: example/get-started/hello_world/rtt/project
            board: sf32lb52-lcd_a128r16
            qemu_machine: sf32lb52x
            run_assert: |
              timeout 60 tools/qemu/qemu-system-arm -M "$QEMU_MACHINE" -nographic -kernel "$ELF" > qemu.log 2>&1 || true
              echo "===== QEMU output ====="
              cat qemu.log
              echo "===== assertions ====="
              grep -q "Hello world!" qemu.log || { echo "FAIL: missing 'Hello world!'"; exit 1; }
              grep -q "msh />"       qemu.log || { echo "FAIL: missing 'msh />'"; exit 1; }
              echo "PASS: hello_world booted to shell in QEMU"

          - name: hello_world
            project: example/get-started/hello_world/rtt/project
            board: sf32lb52-lchspi-ulp
            qemu_machine: "sf32lb52x,flash-base=0x12020000"
            run_assert: |
              timeout 60 tools/qemu/qemu-system-arm -M "$QEMU_MACHINE" -nographic -kernel "$ELF" > qemu.log 2>&1 || true
              echo "===== QEMU output ====="
              cat qemu.log
              echo "===== assertions ====="
              grep -q "Hello world!" qemu.log || { echo "FAIL: missing 'Hello world!'"; exit 1; }
              grep -q "msh />"       qemu.log || { echo "FAIL: missing 'msh />'"; exit 1; }
              echo "PASS: hello_world booted to shell in QEMU"

          - name: hello_world
            project: example/get-started/hello_world/rtt/project
            board: sf32lb52-lcd_n16r8
            qemu_machine: "sf32lb52x,flash-base=0x12020000"
            run_assert: |
              timeout 60 tools/qemu/qemu-system-arm -M "$QEMU_MACHINE" -nographic -kernel "$ELF" > qemu.log 2>&1 || true
              echo "===== QEMU output ====="
              cat qemu.log
              echo "===== assertions ====="
              grep -q "Hello world!" qemu.log || { echo "FAIL: missing 'Hello world!'"; exit 1; }
              grep -q "msh />"       qemu.log || { echo "FAIL: missing 'msh />'"; exit 1; }
              echo "PASS: hello_world booted to shell in QEMU"

          - name: lvgl_v8_demos
            project: example/multimedia/lvgl/lvgl_v8_demos/project
            board: sf32lb52-lcd_a128r16
            qemu_machine: sf32lb52x
            run_assert: |
              # 每次检查动画冒烟及固定场景；每日/手动运行额外等待完整性能报告。
              benchmark_args=()
              if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                benchmark_args=(--benchmark-source example/multimedia/lvgl/lvgl_v8_demos/src/lv_demos/benchmark/lv_demo_benchmark.c --timeout 240)
              fi
              python3 tools/qemu/headless_check.py \
                --qemu tools/qemu/qemu-system-arm \
                --machine "$QEMU_MACHINE" \
                --kernel "$ELF" \
                --expect-size 390x450 --expect-nonblack 0.5 --expect-colors 16 --min-diff-cells 8 \
                --shots 6 --shot-interval 1.5 --settle 14 \
                --serial-log qemu.log --ppm-dir shots "${benchmark_args[@]}"
              python3 tools/qemu/demo_visual_check.py \
                --qemu tools/qemu/qemu-system-arm --machine "$QEMU_MACHINE" --kernel "$ELF" \
                --source example/multimedia/lvgl/lvgl_v8_demos/src/lv_demos/benchmark/lv_demo_benchmark.c \
                --references tools/qemu/ref_imgs/benchmark_sf32lb52-lcd_a128r16 \
                --output demo-visual --serial-log qemu-demo-visual.log --timeout 180

          - name: lvgl_v8_examples
            project: example/multimedia/lvgl/lvgl_v8_examples/project
            board: sf32lb52-lcd_a128r16
            qemu_machine: sf32lb52x
            run_assert: |
              python3 tools/qemu/headless_check.py \
                --qemu tools/qemu/qemu-system-arm \
                --machine "$QEMU_MACHINE" \
                --kernel "$ELF" \
                --expect-size 390x450 --expect-nonblack 0.15 --expect-colors 12 \
                --shots 3 --shot-interval 1.0 --settle 14 --no-flow \
                --reference tools/qemu/ref_imgs/lvgl_v8_examples_sf32lb52-lcd_a128r16.png \
                --serial-log qemu.log --ppm-dir shots
              python3 tools/qemu/touch_check.py \
                --qemu tools/qemu/qemu-system-arm --machine "$QEMU_MACHINE" --kernel "$ELF" \
                --initial-reference tools/qemu/ref_imgs/lvgl_v8_examples_sf32lb52-lcd_a128r16.png \
                --references tools/qemu/ref_imgs/scroll_touch_sf32lb52-lcd_a128r16 \
                --output touch-visual --serial-log qemu-touch.log

          - name: lvgl_v8_demos_hardware
            project: example/multimedia/lvgl/lvgl_v8_demos/project
            board: sf32lb52-lchspi-ulp
            qemu_machine: "sf32lb52x,flash-base=0x12020000,flash-size=33554432,psram-size=8388608"
            run_assert: |
              python3 tools/qemu/demo_visual_check.py \
                --qemu /tmp/qemu-hardware/build/qemu-system-arm \
                --machine "$QEMU_MACHINE" --kernel "$ELF" \
                --device i2c-echo,bus=i2c2,address=0x49 \
                --source example/multimedia/lvgl/lvgl_v8_demos/src/lv_demos/benchmark/lv_demo_benchmark.c \
                --references hardware-actual --record --renderer epic \
                --output demo-visual --serial-log qemu-demo-visual.log --timeout 1200
              python3 tools/qemu/hardware_ci_report.py \
                --hardware tools/qemu/ref_imgs/hardware_lchspi_ulp \
                --qemu hardware-actual --output hardware-comparison

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install SDK toolchain (arm-none-eabi-gcc, scons)
        run: ./install.sh --profile default

      - name: Build firmware
        run: |
          source ./export.sh
          which scons arm-none-eabi-gcc
          arm-none-eabi-gcc --version | head -1
          if [[ "${{ matrix.name }}" == lvgl_v8_demos* ]]; then
            python3 tools/qemu/build_visual_firmware.py --board=${{ matrix.board }} -j$(nproc)
          else
            cd "${{ matrix.project }}"
            scons --board=${{ matrix.board }} -j$(nproc)
          fi

      - name: Install QEMU runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsndio7.0 libpixman-1-0 libglib2.0-0 libnuma1
          echo "=== ldd missing check ==="
          ldd tools/qemu/qemu-system-arm | grep "not found" || echo "all shared libs resolved"

      - name: Install screenshot comparison dependency
        if: startsWith(matrix.name, 'lvgl_v8_')
        run: |
          uv venv /tmp/qemu-test-venv
          uv pip install --python /tmp/qemu-test-venv/bin/python -r tools/qemu/requirements.txt
          echo "/tmp/qemu-test-venv/bin" >> "$GITHUB_PATH"
          source /tmp/qemu-test-venv/bin/activate
          python3 -m unittest discover -s tests -p test_qemu_screenshot.py

      - name: Build QEMU with hardware comparison fixes
        if: matrix.name == 'lvgl_v8_demos_hardware'
        run: |
          sudo apt-get install -y ninja-build pkg-config python3-venv libglib2.0-dev libpixman-1-dev
          git clone --filter=blob:none --no-checkout https://github.com/rabbitsaviola/qemu.git /tmp/qemu-hardware
          git -C /tmp/qemu-hardware checkout 46044958d5fe38060e2179ffddfd55e500630f4d
          git -C /tmp/qemu-hardware apply "$GITHUB_WORKSPACE/tools/qemu/patches/hardware-epic.patch"
          mkdir /tmp/qemu-hardware/build
          cd /tmp/qemu-hardware/build
          ../configure --target-list=arm-softmmu --disable-docs --disable-tools --disable-guest-agent --disable-werror --disable-gtk --disable-sdl --disable-opengl
          ninja -j2 qemu-system-arm

      - name: Run firmware in QEMU and assert
        timeout-minutes: 25
        run: |
          chmod +x tools/qemu/qemu-system-arm
          export ELF="${{ matrix.project }}/build_${{ matrix.board }}_hcpu/main.elf"
          export QEMU_MACHINE="${{ matrix.qemu_machine }}"
          ls -la "$ELF"
          ${{ matrix.run_assert }}

      - name: Upload QEMU log & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.board }}
          path: |
            qemu.log
            qemu.log.qemu.log
            shots/*.ppm
            shots/*.png
            qemu-demo-visual.log*
            demo-visual/
            qemu-touch.log*
            touch-visual/
            hardware-comparison/
            hardware-actual/
            ${{ matrix.project }}/build_${{ matrix.board }}_hcpu/main.elf
            ${{ matrix.project }}/build_${{ matrix.board }}_hcpu/rtconfig.h
          if-no-files-found: ignore
